<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de productos</title>
</head>
<body>
    <h1>Lista de productos</h1>
    <ul>
        {% for p in productos %}
            <li>{{ p.nombre }} - ${{ p.precio }} (Stock: {{ p.stock }}) | {{ p.categoria }} | {{ p.proveedor }}</li>
        {% empty %}
            <li>No hay productos disponibles.</li>
        {% endfor %}
    </ul>
    <a href="/">Volver al inicio</a>
</body>
</html>
